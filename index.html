<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dither</title>
<style>
:root{
  --bg:#FEFDF1; --ink:#1D1B1D; --on-ink:#FEFDF1; --accent:#FF0040;
  --line:rgba(29,27,29,.10); --line-strong:rgba(29,27,29,.26); --muted:rgba(29,27,29,.55);
  --hover:rgba(29,27,29,.06); --stage:#F4F2E3; --checker:rgba(29,27,29,.07);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1B1D; --ink:#FEFDF1; --on-ink:#1D1B1D;
    --line:rgba(254,253,241,.10); --line-strong:rgba(254,253,241,.28); --muted:rgba(254,253,241,.55);
    --hover:rgba(254,253,241,.07); --stage:#161416; --checker:rgba(254,253,241,.08); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1D1B1D; --ink:#FEFDF1; --on-ink:#1D1B1D;
  --line:rgba(254,253,241,.10); --line-strong:rgba(254,253,241,.28); --muted:rgba(254,253,241,.55);
  --hover:rgba(254,253,241,.07); --stage:#161416; --checker:rgba(254,253,241,.08); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;font-size:13px;line-height:1.35;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:300px 1fr;grid-template-rows:56px minmax(0,1fr)}
.top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}
.top .spacer{flex:1}
.size-readout{color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.panel{overflow:auto;border-right:1px solid var(--line);padding:0 16px 40px}
.stage{position:relative;background:var(--stage);overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:0}

.btn{height:32px;padding:0 14px;border-radius:6px;border:1px solid transparent;cursor:pointer;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .12s,color .12s,border-color .12s}
.btn-primary{background:var(--ink);color:var(--on-ink)}
.btn-primary:hover{background:color-mix(in srgb,var(--ink) 86%,var(--bg))}
.btn-secondary{background:transparent;border-color:var(--ink);color:var(--ink)}
.btn-secondary:hover{background:var(--hover)}
.btn-secondary[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.btn-ghost{background:transparent;color:var(--ink);padding:0 10px}
.btn-ghost:hover{background:var(--hover)}
.btn-sm{height:26px;padding:0 9px;font-size:12px}
.btn-icon{width:28px;padding:0}

.seg{display:flex;padding:2px;gap:2px;border:1px solid var(--line-strong);border-radius:7px}
.seg button{flex:1;height:26px;border:0;border-radius:5px;background:transparent;color:var(--muted);cursor:pointer;padding:0 10px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.top .seg button{height:28px;padding:0 14px}

.sec{padding:16px 0;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:0 0 12px;min-height:20px}
.sec-h h2{font-size:13px;font-weight:600;margin:0;margin-right:auto}
.sub{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:8px}
.sub .sec-h{margin-bottom:8px}
.sub .sec-h h2{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.row{display:grid;grid-template-columns:72px 1fr 44px;align-items:center;gap:10px;min-height:28px}
.lbl{color:var(--muted)}
output{text-align:right;font-variant-numeric:tabular-nums}
.stack > * + *{margin-top:8px}
.field{height:28px;border:1px solid var(--line-strong);border-radius:6px;background:transparent;padding:0 8px;width:100%;font-variant-numeric:tabular-nums}
.field:focus{border-color:var(--ink);outline:none}
select.field{appearance:none;-webkit-appearance:none;padding-right:26px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 13px) 12px,calc(100% - 9px) 12px;background-size:4px 4px;background-repeat:no-repeat}
select.field option{background:var(--bg);color:var(--ink)}
.preset-row{display:flex;gap:6px;align-items:center}
.preset-row .field{flex:1;min-width:0}
.preset-row + .preset-row{margin-top:8px}
.var{margin-top:10px}
.var .btn{width:100%}
.disc{background:none;border:0;padding:0;font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer;margin-right:auto}
.chev{display:inline-block;width:10px;transition:transform .15s;color:var(--muted)}
.disc[aria-expanded="true"] .chev{transform:rotate(90deg)}
.sec-h.closed{margin-bottom:0}
.seed-actions{display:flex;gap:6px;justify-content:flex-end}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0;cursor:pointer;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:linear-gradient(var(--ink),var(--ink)) 0/var(--p) 100% no-repeat,var(--line-strong)}
input[type=range]::-moz-range-track{height:2px;border-radius:2px;background:linear-gradient(var(--ink),var(--ink)) 0/var(--p) 100% no-repeat,var(--line-strong)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--ink);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--ink);margin-top:-5px}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--ink);border:2px solid var(--bg);box-shadow:0 0 0 1px var(--ink)}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 2px var(--accent)}

.tg{display:flex;align-items:center;justify-content:space-between;min-height:28px;cursor:pointer}
.tg input{position:absolute;opacity:0;pointer-events:none}
.sw{width:28px;height:16px;border-radius:9px;background:var(--line-strong);position:relative;transition:background .15s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--bg);transition:transform .15s}
.tg input:checked + .sw{background:var(--ink)}
.tg input:checked + .sw::after{transform:translateX(12px)}
.tg input:focus-visible + .sw{outline:2px solid var(--accent);outline-offset:2px}
.sec-h .tg{min-height:0}

.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swatch{width:22px;height:22px;border-radius:5px;border:1px solid var(--line-strong);cursor:pointer;padding:0}
.swatch[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.swatch.checker{background:repeating-conic-gradient(var(--checker) 0 25%,transparent 0 50%) 0 0/8px 8px}
.hex{display:grid;grid-template-columns:28px 1fr;gap:8px;margin-top:10px;align-items:center}
.hex input[type=color]{width:28px;height:28px;border:1px solid var(--line-strong);border-radius:6px;padding:2px;background:transparent;cursor:pointer}
.hex input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.hex input[type=color]::-webkit-color-swatch{border:0;border-radius:3px}
.seed{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;margin-top:4px}

.art{position:relative;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.art.checker{background:repeating-conic-gradient(var(--checker) 0 25%,transparent 0 50%) 0 0/16px 16px}
#cv{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
#ov{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;overflow:visible}
#ov.pan{cursor:grab}
#ov.pan.grabbing{cursor:grabbing}
.stage-tools{position:absolute;left:16px;bottom:16px;display:flex;gap:12px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.stage-tools .swatch{width:18px;height:18px;border-radius:4px}
.stage-tools .div{width:1px;height:18px;background:var(--line)}
.hint{position:absolute;right:16px;bottom:16px;color:var(--muted);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.empty .btn{pointer-events:auto}
.stage.drop::after{content:"";position:absolute;inset:12px;border:1.5px dashed var(--ink);border-radius:10px;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--ink);color:var(--on-ink);padding:8px 14px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.toast.show{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none !important}

@media (max-width:760px){
  html,body{height:auto}
  .app{height:auto;grid-template-columns:1fr;grid-template-rows:auto 58vh auto}
  .top{flex-wrap:wrap;padding:10px 12px;gap:8px}
  .top .seg{order:3;width:100%}
  .size-readout{display:none}
  .panel{border-right:0;border-top:1px solid var(--line);overflow:visible}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="seg" id="modeSeg" role="group" aria-label="Mode">
      <button type="button" data-mode-btn="blob">Blob</button>
      <button type="button" data-mode-btn="gradient">Gradient</button>
      <button type="button" data-mode-btn="photo">Photo</button>
    </div>
    <div class="spacer"></div>
    <span class="size-readout">1688 × 1000</span>
    <button class="btn btn-secondary" id="copyBtn" type="button">Copy PNG</button>
    <button class="btn btn-primary" id="exp1" type="button">Export PNG</button>
  </header>
  <aside class="panel" id="panel"></aside>
  <main class="stage" id="stage">
    <div class="art" id="art">
      <canvas id="cv"></canvas>
      <svg id="ov" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"></svg>
    </div>
    <div class="empty" id="empty" hidden><button class="btn btn-primary" type="button" id="emptyPick">Upload a photo</button></div>
    <div class="stage-tools">
      <div class="swatches" id="previewSw"></div>
      <div class="div"></div>
      <button class="btn btn-ghost btn-sm" type="button" id="hdlBtn">Hide handles</button>
    </div>
    <div class="hint" id="hint"></div>
  </main>
</div>
<input type="file" id="file" accept="image/*" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="sec-h closed" id="turbHead"><button class="disc" type="button" id="turbOpen" aria-expanded="false" aria-controls="turbBody"><span class="chev" aria-hidden="true">▸</span><span id="turbTitle">Turbulence</span></button>
    <label class="tg"><input type="checkbox" data-bind="turb.on" aria-label="Turbulence on"><span class="sw"></span></label>
  </div>
  <div id="turbBody" hidden>
    ${sl('Scale', 'turb.scale', .5, 12, .1, 'dec1')}
    ${sl('Amount', 'turb.amount', 0, .3, .002, 'dec2')}
    ${sl('Detail', 'turb.detail', 1, 7, 1, 'int')}
    ${sl('Breakup', 'turb.breakup', 0, 1, .01, 'pct')}
    <div class="seed"><span class="lbl">Seed</span><div class="seed-actions"><button class="btn btn-ghost btn-sm" type="button" id="seedRand" aria-label="Random seed" title="Random seed"><svg width="20" height="16" viewBox="0 0 20 16" aria-hidden="true" style="flex:none"><rect x="1" y="4" width="9" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="3.6" cy="6.6" r="1" fill="currentColor"/><circle cx="5.5" cy="8.5" r="1" fill="currentColor"/><circle cx="7.4" cy="10.4" r="1" fill="currentColor"/><g transform="rotate(12 15 7)"><rect x="10.5" y="2.5" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="12.8" cy="4.8" r="1" fill="currentColor"/><circle cx="16.2" cy="8.2" r="1" fill="currentColor"/></g></svg></button><button class="btn btn-ghost btn-sm" type="button" id="turbReset">Reset</button></div></div>
  </div>
</section>

<section class="sec">
  <div class="sec-h"><h2>Color</h2></div>
  <div class="swatches" id="inkSw"></div>
  <div class="hex"><input type="color" id="inkPick" aria-label="Ink color"><input class="field" id="inkHex" maxlength="7" aria-label="Ink hex"></div>
  <div style="margin-top:10px">${tg('transparent', 'Transparent background')}${tg('soft', 'No hard edges')}</div>
</section>`;

$('#inkSw').innerHTML = INKS.map(c => `<button class="swatch" type="button" data-ink="${c}" style="background:${c}" aria-label="Ink ${c}"></button>`).join('');
$('#previewSw').innerHTML = PREVIEWS.map(([c, l]) => `<button class="swatch${c === 'transparent' ? ' checker' : ''}" type="button" data-prev="${c}" ${c !== 'transparent' ? `style="background:${c}"` : ''} aria-label="Preview on ${l}" title="${l}"></button>`).join('');

function getP(path) {
  if (path === 'bcount') return S.blob.points.length;
  if (path.startsWith('point.')) { const p = S.blob.points[sel]; return p ? p[path.slice(6)] : 0; }
  return path.split('.').reduce((o, k) => o[k], S);
}
function setP(path, v) {
  if (path === 'bcount') { layoutBlobs(S, Math.max(v, S.blob.points.filter(p => p.lock).length)); if (sel >= S.blob.points.length) sel = -1; return; }
  if (path.startsWith('point.')) { const p = S.blob.points[sel]; if (p) p[path.slice(6)] = v; return; }
  const ks = path.split('.'); let o = S; for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = v;
}
function fmt(v, f) {
  switch (f) {
    case 'x': return v.toFixed(2) + '×';
    case 'int': return String(Math.round(v));
    case 'pct': return Math.round(v * 100) + '%';
    case 'spct': return (v > 0 ? '+' : '') + Math.round(v * 100) + '%';
    case 'dec1': return (+v).toFixed(1);
    default: return (+v).toFixed(2);
  }
}
function syncRange(r) {
  const v = getP(r.dataset.bind); r.value = v;
  r.style.setProperty('--p', clamp((v - r.min) / (r.max - r.min)) * 100 + '%');
  const out = r.parentElement.querySelector('output'); if (out) out.textContent = fmt(+r.value, r.dataset.fmt);
}
function syncPoint() {
  const on = S.mode === 'blob' && sel >= 0 && !!S.blob.points[sel];
  $('#pointSec').hidden = !on;
  if (on) { $$('#pointSec input[type=range]').forEach(syncRange); $('#pointSec input[type=checkbox]').checked = !!S.blob.points[sel].lock; }
  const pts = S.blob.points, all = pts.length > 0 && pts.every(p => p.lock);
  $('#lockAll').textContent = all ? 'Unlock points' : 'Lock points';
  const bc = $('input[data-bind="bcount"]'); if (bc) syncRange(bc);
}
const HINTS = {
  blob: 'Click to add · Drag to move · Delete to remove',
  linear: 'Drag the two handles to set direction',
  radial: 'Drag the center or the square to resize',
  edge: 'Drag handles in from any edge',
  photo: 'Drag to reposition · Scroll to zoom · Drag lines to set fade'
};
function syncUI(light) {
  $$('input[type=range][data-bind]').forEach(r => { if (!r.dataset.bind.startsWith('point.')) syncRange(r); });
  if (light) return;
  $$('input[type=checkbox][data-bind]').forEach(c => c.checked = !!getP(c.dataset.bind));
  $$('[data-seg]').forEach(g => { const v = getP(g.dataset.seg); $$('button', g).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v))); });
  $$('[data-mode-btn]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.modeBtn === S.mode)));
  $$('[data-in]').forEach(s => s.hidden = s.dataset.in !== S.mode);
  $('[data-fade]').hidden = S.photo.fade === 'none';
  $('#turbTitle').textContent = S.mode === 'photo' ? 'Dissolve' : 'Turbulence';
  $('#turbBody').hidden = !turbOpen; $('#turbHead').classList.toggle('closed', !turbOpen); $('#turbOpen').setAttribute('aria-expanded', String(turbOpen));
  $('#turbBody').style.opacity = S.turb.on ? '' : '.4';
  $('#turbBody').style.pointerEvents = S.turb.on ? '' : 'none';
  $('#varRow').hidden = !S.look;
  $$('[data-ink]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.ink.toLowerCase() === S.ink.toLowerCase())));
  $('#inkHex').value = S.ink.toUpperCase(); $('#inkPick').value = S.ink;
  $$('[data-prev]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.prev === S.preview)));
  art.classList.toggle('checker', S.preview === 'transparent');
  art.style.background = S.preview === 'transparent' ? '' : S.preview;
  $('#hdlBtn').textContent = showH ? 'Hide handles' : 'Show handles';
  const hk = S.mode === 'gradient' ? S.gradient.type : S.mode;
  $('#hint').textContent = HINTS[hk]; $('#hint').hidden = !showH || (S.mode === 'photo' && S.photo.fade === 'none' && false);
  $('#sampleBtn').hidden = !!(photo && photo.sample);
  syncPoint(); fit();
}

const panel = $('#panel');
panel.addEventListener('input', e => {
  const t = e.target;
  if (t.type === 'range' && t.dataset.bind) { setP(t.dataset.bind, parseFloat(t.value)); syncRange(t); if (t.dataset.bind === 'density') syncUI(true); drawOverlay(); req(); }
});
panel.addEventListener('change', e => {
  const t = e.target;
  if (t.type === 'checkbox' && t.dataset.bind) { setP(t.dataset.bind, t.checked); syncUI(); drawOverlay(); req(); }
});
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.modeBtn) { switchMode(b.dataset.modeBtn); return; }
  const g = b.closest('[data-seg]');
  if (g && b.dataset.v) { setP(g.dataset.seg, b.dataset.v); syncUI(); req(); return; }
  if (b.dataset.ink) { S.ink = b.dataset.ink; syncUI(); req(); return; }
  if (b.dataset.prev) { S.preview = b.dataset.prev; syncUI(); return; }
});
$('#seedRand').addEventListener('click', () => { S.turb.seed = 1 + Math.floor(Math.random() * 99998); req(); });
$('#turbOpen').addEventListener('click', () => { turbOpen = !turbOpen; syncUI(); });
$('#lockAll').addEventListener('click', () => { const pts = S.blob.points, all = pts.length > 0 && pts.every(p => p.lock); pts.forEach(p => p.lock = !all); syncUI(); drawOverlay(); });
$('#turbReset').addEventListener('click', () => { S.turb = clone(presetTurb); if (S.look) S.turb.seed = S.look.seed; syncUI(); req(); });
$('#pRemove').addEventListener('click', removeSel);
$('#hdlBtn').addEventListener('click', () => { showH = !showH; syncUI(); });
$('#centerBtn').addEventListener('click', () => { S.photo.ox = 0; S.photo.oy = 0; S.photo.zoom = 1; syncUI(); req(); });
const setInk = v => { if (/^#?[0-9a-f]{6}$/i.test(v)) { S.ink = (v[0] === '#' ? v : '#' + v).toUpperCase(); syncUI(); req(); } };
$('#inkHex').addEventListener('change', e => setInk(e.target.value.trim()));
$('#inkPick').addEventListener('input', e => setInk(e.target.value));

/* Variation */
function setLook(seed) { if (!S.look) return; S.look.seed = seed; applyLook(S); if (sel >= S.blob.points.length || (sel >= 0 && !S.blob.points[sel].lock)) sel = -1; syncUI(); req(); }
$('#varRand').addEventListener('click', () => setLook(1 + Math.floor(Math.random() * 99998)));

/* ---------- Presets & modes ---------- */
const presetsFor = m => ({
  b: BUILTIN.map((p, i) => [i, p]).filter(([, p]) => p.data.mode === m),
  c: custom.map((p, i) => [i, p]).filter(([, p]) => p.data.mode === m)
});
function fillPresets() {
  const { b, c } = presetsFor(S.mode), esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  $('#preset').innerHTML = `<optgroup label="Starters">${b.map(([i, p]) => `<option value="b:${i}">${p.name}</option>`).join('')}</optgroup>` +
    (c.length ? `<optgroup label="Saved">${c.map(([i, p]) => `<option value="c:${i}">${esc(p.name)}</option>`).join('')}</optgroup>` : '');
  $('#preset').value = currentPreset;
  $('#pDel').hidden = !currentPreset.startsWith('c:');
}
function loadPreset(v) {
  const [t, i] = v.split(':'), src = t === 'b' ? BUILTIN[+i] : custom[+i];
  if (!src) return;
  const soft = S.soft;
  currentPreset = v; S = merge(clone(BASE), src.data); S.soft = soft; sel = -1;
  presetTurb = clone(S.turb);
  fillPresets(); syncUI(); req();
}
function switchMode(m) {
  if (m === S.mode) return;
  modeCache[S.mode] = { S: clone(S), preset: currentPreset, turb: clone(presetTurb) };
  const soft = S.soft;
  if (modeCache[m]) { const c = modeCache[m]; S = clone(c.S); currentPreset = c.preset; presetTurb = clone(c.turb); S.soft = soft; sel = -1; fillPresets(); syncUI(); req(); }
  else { const { b } = presetsFor(m); loadPreset('b:' + b[0][0]); }
  if (m === 'photo' && !photo) useSample();
}
$('#preset').addEventListener('change', e => loadPreset(e.target.value));
$('#pSave').addEventListener('click', () => {
  $('#presetRow').hidden = true; $('#saveRow').hidden = false;
  const cur = currentPreset.startsWith('c:') ? custom[+currentPreset.slice(2)] : null;
  $('#pName').value = cur ? cur.name : ''; $('#pName').focus();
});
const closeSave = () => { $('#presetRow').hidden = false; $('#saveRow').hidden = true; };
$('#pCancel').addEventListener('click', closeSave);
const doSave = () => {
  const name = $('#pName').value.trim(); if (!name) { $('#pName').focus(); return; }
  let i = custom.findIndex(p => p.name.toLowerCase() === name.toLowerCase() && p.data.mode === S.mode);
  const entry = { name, data: clone(S) };
  if (i < 0) { custom.push(entry); i = custom.length - 1; } else custom[i] = entry;
  saveCustom(); currentPreset = 'c:' + i; presetTurb = clone(S.turb); fillPresets(); closeSave(); toast('Preset saved');
};
$('#pOk').addEventListener('click', doSave);
$('#pName').addEventListener('keydown', e => { if (e.key === 'Enter') doSave(); if (e.key === 'Escape') closeSave(); });
$('#pDel').addEventListener('click', () => {
  if (!currentPreset.startsWith('c:')) return;
  custom.splice(+currentPreset.slice(2), 1); saveCustom();
  const { b } = presetsFor(S.mode); currentPreset = 'b:' + b[0][0]; fillPresets(); toast('Preset deleted');
});

/* ---------- Photo input ---------- */
const fileIn = $('#file');
const pick = () => fileIn.click();
$('#pickBtn').addEventListener('click', pick); $('#emptyPick').addEventListener('click', pick);
function setPhoto(src, sample) {
  const img = new Image();
  img.onload = () => { photo = { img, id: sample ? 'sample' : 'u' + Date.now(), sample }; lumCache.key = ''; S.photo.ox = 0; S.photo.oy = 0; S.photo.zoom = 1; syncUI(); req(); };
  img.onerror = () => toast('That file could not be read as an image');
  img.src = src;
}
const useSample = () => setPhoto(SAMPLE_SRC, true);
$('#sampleBtn').addEventListener('click', useSample);
function loadFile(f) {
  if (!f || !f.type.startsWith('image/')) return;
  if (S.mode !== 'photo') switchMode('photo');
  setPhoto(URL.createObjectURL(f), false);
}
fileIn.addEventListener('change', e => { loadFile(e.target.files[0]); fileIn.value = ''; });
stage.addEventListener('dragover', e => { e.preventDefault(); stage.classList.add('drop'); });
stage.addEventListener('dragleave', e => { if (e.target === stage) stage.classList.remove('drop'); });
stage.addEventListener('drop', e => { e.preventDefault(); stage.classList.remove('drop'); loadFile(e.dataTransfer.files[0]); });

/* ---------- Export: 1-bit indexed PNG ---------- */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function chunk(type, data) {
  const out = new Uint8Array(12 + data.length), dv = new DataView(out.buffer);
  dv.setUint32(0, data.length); for (let i = 0; i < 4; i++) out[4 + i] = type.charCodeAt(i);
  out.set(data, 8); dv.setUint32(8 + data.length, crc32(out.subarray(4, 8 + data.length))); return out;
}
async function buildPNG(scale) {
  const r = compute(S, PX);
  if (r.empty) throw new Error('empty');
  const ow = W * scale, oh = H * scale, cell = PX * scale, rb = Math.ceil(ow / 8);
  const transparent = S.transparent || S.preview === 'transparent';
  const bgHex = S.preview === 'transparent' ? '#FFFFFF' : S.preview;
  if (typeof CompressionStream === 'undefined') {
    const c = document.createElement('canvas'); c.width = ow; c.height = oh; const x = c.getContext('2d');
    if (!transparent) { x.fillStyle = bgHex; x.fillRect(0, 0, ow, oh); }
    x.fillStyle = S.ink;
    for (let j = 0; j < r.gh; j++) for (let i = 0; i < r.gw; i++) if (r.ink[j * r.gw + i]) x.fillRect(i * cell, j * cell, cell, cell);
    return await new Promise(res => c.toBlob(res, 'image/png'));
  }
  const raw = new Uint8Array((rb + 1) * oh), row = new Uint8Array(rb);
  for (let j = 0; j < r.gh; j++) {
    row.fill(0);
    for (let x = 0; x < ow; x++) if (r.ink[j * r.gw + Math.floor(x / cell)]) row[x >> 3] |= 0x80 >> (x & 7);
    const y1 = Math.min((j + 1) * cell, oh);
    for (let y = j * cell; y < y1; y++) { raw[y * (rb + 1)] = 0; raw.set(row, y * (rb + 1) + 1); }
  }
  const z = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer());
  const ih = new Uint8Array(13), dv = new DataView(ih.buffer);
  dv.setUint32(0, ow); dv.setUint32(4, oh); ih[8] = 1; ih[9] = 3;
  const parts = [new Uint8Array([137, 80, 78, 71, 13, 10, 26, 10]), chunk('IHDR', ih), chunk('PLTE', new Uint8Array([...hexRgb(bgHex), ...hexRgb(S.ink)]))];
  if (transparent) parts.push(chunk('tRNS', new Uint8Array([0, 255])));
  parts.push(chunk('IDAT', z), chunk('IEND', new Uint8Array(0)));
  return new Blob(parts, { type: 'image/png' });
}
const slug = () => {
  const [t, i] = currentPreset.split(':'); const n = (t === 'b' ? BUILTIN[+i] : custom[+i])?.name || S.mode;
  const base = n.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'dither';
  return S.look ? `${base}-v${S.look.seed}` : base;
};
let downloads = null;
async function exportPNG(scale) {
  try {
    const blob = await buildPNG(scale);
    const filename = `${slug()}-${W}x${H}${scale > 1 ? '@2x' : ''}.png`;
    if (!downloads) {
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000); toast('Saved'); return;
    }
    await downloads.save({ filename, data: blob });
    toast('Saved');
  } catch (e) {
    if (e && e.message === 'empty') toast('Upload a photo first');
    else if (e && e.code === 'declined') return;
    else if (e && e.code === 'rate_limited') toast('A save is already open');
    else toast('Export failed');
  }
}
$('#exp1').addEventListener('click', () => exportPNG(1));
$('#copyBtn').addEventListener('click', async () => {
  try {
    const blob = await buildPNG(1);
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    toast('Copied');
  } catch (e) { toast(e && e.message === 'empty' ? 'Upload a photo first' : 'Copy is blocked here — use Export'); }
});
if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('downloads').then(d => { downloads = d; }).catch(() => {});
}
let tt = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1800); }

/* ---------- Boot ---------- */
new ResizeObserver(() => fit()).observe(stage);
fillPresets(); syncUI(); req();
})();
</script>
